name: release

on:
    push:
        tags: ["v*"]

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4

            - name: Create release
              run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

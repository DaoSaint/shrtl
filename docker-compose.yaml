services:
    shrtl:
        build: .
        image: shrtl:dev
        restart: unless-stopped
        ports:
            - "3000:3000"
        volumes:
            - shrtl-data:/data
        environment:
            DATABASE_PATH: /data/shrtl.db
            TRUST_PROXY: ${TRUST_PROXY:-}

volumes:
    shrtl-data:
